[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "egqca"
version = "1.0.1"
description = "Extended Generalized QuasiChemical Approximation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "matplotlib-label-lines", "ase>=3.25", "spglib"]
optional-dependencies = { upet = ["upet"], mace = ["mace-torch"], mattersim = ["mattersim"], grace = ["tensorpotential>=0.6.1"], test = ["pytest>=8,<9"], docs = ["mkdocs>=1.6,<2", "mkdocstrings[python]>=0.26", "black"] }
license = { text = "MIT" }
authors = [
  { name = "Pedro Nunes Ferreira", email = "nunesferreira@tugraz.at" },
  { name = "Dominik Spath", email="dominik.spath@tugraz.at"},
  { name = "Luka Wibmer", email="luka.wibmer@tugraz.at"}
]

[project.urls]
Homepage = "https://github.com/egqca/egqca"
Documentation = "https://egqca.github.io/egqca/"
Source = "https://github.com/egqca/egqca"
Issues = "https://github.com/egqca/egqca/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
